openapi: "3.0.3"
info:
  title: Countdown API
  description: |
    RESTful API for a countdown application.
    Users can register, manage their profile, and create/update/delete countdowns.

    **Authentication:** A JWT is stored in an httpOnly cookie named `user_jwt`
    after login or registration. Protected routes require this cookie. The
    `proxy.ts` middleware reads the cookie, verifies the JWT, and injects an
    `x-user-id` header into the request for downstream route handlers.
  version: "1.0.0"

servers:
  - url: /api
    description: API base path

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          headers:
            Set-Cookie:
              schema:
                type: string
                description: "`user_jwt` httpOnly cookie (maxAge: 24h)"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and receive a JWT cookie
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          headers:
            Set-Cookie:
              schema:
                type: string
                description: "`user_jwt` httpOnly cookie (maxAge: 24h)"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear the session cookie
      operationId: logout
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 204
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the currently authenticated user's profile
      operationId: getMe
      parameters:
        - name: x-user-id
          in: header
          required: true
          description: User UUID injected by auth middleware
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

    delete:
      tags: [Auth]
      summary: Permanently delete own account and all associated countdowns
      operationId: deleteAccount
      parameters:
        - name: x-user-id
          in: header
          required: true
          description: User UUID injected by auth middleware
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Account deleted successfully (clears user_jwt cookie)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /countdowns:
    get:
      tags: [Countdowns]
      summary: List all countdowns belonging to the authenticated user
      operationId: listCountdowns
      parameters:
        - name: x-user-id
          in: header
          required: true
          description: User UUID injected by auth middleware
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of countdowns (ordered by due_date ascending)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Countdown"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Countdowns]
      summary: Create a new countdown
      operationId: createCountdown
      parameters:
        - name: x-user-id
          in: header
          required: true
          description: User UUID injected by auth middleware
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, due_date]
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                due_date:
                  type: string
                  format: date-time
                  description: The target date/time for the countdown (must be in the future)
      responses:
        "201":
          description: Countdown created
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message:
                    type: string
                    example: "Countdown created"
                  data:
                    $ref: "#/components/schemas/Countdown"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /countdowns/{id}:
    get:
      tags: [Countdowns]
      summary: Get a single countdown by ID
      operationId: getCountdown
      parameters:
        - name: id
          in: path
          required: true
          description: Countdown UUID
          schema:
            type: string
            format: uuid
        - name: x-user-id
          in: header
          required: true
          description: User UUID injected by auth middleware
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Countdown details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Countdown"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Countdowns]
      summary: Update an existing countdown (partial or full update)
      operationId: updateCountdown
      parameters:
        - name: id
          in: path
          required: true
          description: Countdown UUID
          schema:
            type: string
            format: uuid
        - name: x-user-id
          in: header
          required: true
          description: User UUID injected by auth middleware
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                due_date:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Updated countdown
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message:
                    type: string
                    example: "Countdown updated"
                  data:
                    $ref: "#/components/schemas/Countdown"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Countdowns]
      summary: Delete a countdown
      operationId: deleteCountdown
      parameters:
        - name: id
          in: path
          required: true
          description: Countdown UUID
          schema:
            type: string
            format: uuid
        - name: x-user-id
          in: header
          required: true
          description: User UUID injected by auth middleware
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Countdown deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Countdown deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /wins:
    get:
      tags: [Wins]
      summary: List all wins belonging to the authenticated user
      operationId: listWins
      parameters:
        - name: x-user-id
          in: header
          required: true
          description: User UUID injected by auth middleware
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: Page number (1-based). Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          description: Number of wins per page. Defaults to 10, max 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Paginated list of wins (ordered by created_at descending, newest first)
          content:
            application/json:
              schema:
                type: object
                required: [meta, data]
                properties:
                  meta:
                    type: object
                    required: [page, perPage, total, totalPage]
                    properties:
                      page:
                        type: integer
                        example: 1
                      perPage:
                        type: integer
                        example: 10
                      total:
                        type: integer
                        description: Total number of wins for the user
                        example: 42
                      totalPage:
                        type: integer
                        description: Total number of pages (ceil(total / perPage))
                        example: 5
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Win"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Wins]
      summary: Create a new win
      operationId: createWin
      parameters:
        - name: x-user-id
          in: header
          required: true
          description: User UUID injected by auth middleware
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
      responses:
        "201":
          description: Win created
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message:
                    type: string
                    example: "Win created"
                  data:
                    $ref: "#/components/schemas/Win"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wins/{id}:
    get:
      tags: [Wins]
      summary: Get a single win by ID
      operationId: getWin
      parameters:
        - name: id
          in: path
          required: true
          description: Win UUID
          schema:
            type: string
            format: uuid
        - name: x-user-id
          in: header
          required: true
          description: User UUID injected by auth middleware
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Win details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Win"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Wins]
      summary: Update an existing win (partial or full update)
      operationId: updateWin
      parameters:
        - name: id
          in: path
          required: true
          description: Win UUID
          schema:
            type: string
            format: uuid
        - name: x-user-id
          in: header
          required: true
          description: User UUID injected by auth middleware
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
      responses:
        "200":
          description: Updated win
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message:
                    type: string
                    example: "Win updated"
                  data:
                    $ref: "#/components/schemas/Win"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Wins]
      summary: Delete a win
      operationId: deleteWin
      parameters:
        - name: id
          in: path
          required: true
          description: Win UUID
          schema:
            type: string
            format: uuid
        - name: x-user-id
          in: header
          required: true
          description: User UUID injected by auth middleware
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Win deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Win deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable status message

    User:
      type: object
      required: [id, username, email, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
        username:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true

    Countdown:
      type: object
      required: [id, id_user, title, due_date, created_at]
      properties:
        id:
          type: string
          format: uuid
        id_user:
          type: string
          format: uuid
          description: Owner of the countdown
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        due_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Win:
      type: object
      required: [id, id_user, title, created_at]
      properties:
        id:
          type: string
          format: uuid
        id_user:
          type: string
          format: uuid
          description: Owner of the win
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ApiError:
      type: object
      required: [title, status, origin, timestamp, message]
      properties:
        title:
          type: string
          description: Machine-readable error code (e.g. "BAD REQUEST", "UNAUTHORIZED")
        status:
          type: integer
          description: HTTP status code
        origin:
          type: string
          description: Route path where the error originated
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
        message:
          type: string
          description: Human-readable error description

  responses:
    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Unauthorized:
      description: Missing, invalid, or expired authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Conflict:
      description: Resource already exists (e.g. email taken)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
